<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#166449">
  <meta name="description" content="Encuentros anteriores publicados en Patitas, una iniciativa de Brújula Austral Familia.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Patitas">
  <title>Más encuentros · Patitas · Brújula Austral Familia</title>
  <link rel="icon" type="image/png" href="https://brujula-austral.vercel.app/brujula-austral-perfil-facebook.png">
  <link rel="apple-touch-icon" href="https://brujula-austral.vercel.app/brujula-austral-perfil-facebook.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./encuentros.js"></script>
  <script defer src="./pwa.js"></script>
</head>
<body class="history-page">
  <svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><symbol id="paw" viewBox="0 0 24 24"><ellipse cx="5.5" cy="8" rx="2.4" ry="3.2" transform="rotate(-25 5.5 8)"/><ellipse cx="11" cy="5" rx="2.3" ry="3.1"/><ellipse cx="17" cy="7" rx="2.3" ry="3.1" transform="rotate(20 17 7)"/><ellipse cx="20" cy="12" rx="2" ry="2.8" transform="rotate(35 20 12)"/><path d="M6 17c0-3 3-7 6-7s6 4 6 7c0 4-4 2-6 2s-6 2-6-2"/></symbol><symbol id="paw-dog" viewBox="0 0 24 24"><ellipse cx="5.5" cy="8" rx="2.4" ry="3.2" transform="rotate(-25 5.5 8)"/><ellipse cx="11" cy="5" rx="2.3" ry="3.1"/><ellipse cx="17" cy="7" rx="2.3" ry="3.1" transform="rotate(20 17 7)"/><ellipse cx="20" cy="12" rx="2" ry="2.8" transform="rotate(35 20 12)"/><path d="M6 17c0-3 3-7 6-7s6 4 6 7c0 4-4 2-6 2s-6 2-6-2"/></symbol><symbol id="paw-cat" viewBox="0 0 24 24"><ellipse cx="6.2" cy="7.2" rx="2" ry="2.8" transform="rotate(-18 6.2 7.2)"/><ellipse cx="10.5" cy="5.1" rx="1.9" ry="2.7"/><ellipse cx="15.1" cy="5.7" rx="1.9" ry="2.7"/><ellipse cx="18.8" cy="8.5" rx="1.9" ry="2.7" transform="rotate(22 18.8 8.5)"/><path d="M6.8 16.7c.2-3.6 2.8-6.2 5.5-6.2 2.8 0 5.2 2.7 5.1 6.2 0 2.8-2.3 3.4-5.2 2.1-2.6 1.3-5.6.8-5.4-2.1z"/></symbol></defs></svg>
  <header>
    <a class="brand" href="./"><span class="brand-logo"><img src="https://brujula-austral.vercel.app/brujula-austral-perfil-facebook.png" alt=""></span>patitas<b>.</b></a>
    <a class="back-link" href="./">← Volver al mapa</a>
  </header>
  <main class="history-main">
    <section class="history-intro">
      <div class="eyebrow">HISTORIAL DE LA COMUNIDAD</div>
      <h1>Más encuentros</h1>
      <p>Aquí quedan los avisos anteriores a los cinco encuentros más recientes.</p>
    </section>
    <section class="history-content">
      <div class="history-heading"><h2>Encuentros anteriores</h2><span id="older-count">0</span></div>
      <div id="older-list" class="history-grid" aria-live="polite"><p class="muted">Cargando encuentros…</p></div>
    </section>
  </main>
  <dialog id="history-detail" aria-labelledby="history-detail-title">
    <button class="close" type="button" aria-label="Cerrar detalle">×</button>
    <h2 id="history-detail-title"></h2>
    <p id="history-detail-date" class="muted small"></p>
    <img id="history-detail-photo" alt="Foto de la mascota encontrada">
    <p id="history-detail-mood"></p>
    <p id="history-detail-note"></p>
    <a class="secondary history-map-link" href="./">⌖ Volver al mapa principal</a>
  </dialog>
  <div id="pwa-message" class="pwa-message" role="status" aria-live="polite" hidden><img src="https://brujula-austral.vercel.app/brujula-austral-perfil-facebook.png" alt=""><div><strong id="pwa-title">Nueva versión disponible</strong><small id="pwa-copy">Puedes actualizar cuando estés listo.</small></div><button id="pwa-later" class="secondary" type="button">Después</button><button id="pwa-action" class="primary" type="button">Actualizar</button></div>
</body>
</html>
